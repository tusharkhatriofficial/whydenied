AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: WhyDenied - turns AWS AccessDenied events into fixes

Parameters:
  GitHubRepo:
    Type: String
    Default: tusharkhatriofficial/whydenied-demo-infra
    Description: owner/name of the Terraform repo WhyDenied opens fix PRs against

  AIProvider:
    Type: String
    Default: openai
    AllowedValues: [openai, bedrock, none]
    Description: Who writes the PR explanation. The fix itself never comes from the AI.
  OpenAIModel:
    Type: String
    Default: gpt-5-mini
  BedrockModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0

Globals:
  Function:
    Runtime: python3.14
    Architectures: [arm64]
    Timeout: 60
    MemorySize: 256

Resources:
  # One item per (principal, action, resource), with a seen_count.
  DenialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: whydenied-denials
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  AnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: whydenied-analyzer
      CodeUri: src/analyzer/
      Handler: app.handler
      Environment:
        Variables:
          DENIALS_TABLE: !Ref DenialsTable
          GITHUB_REPO: !Ref GitHubRepo
          # SecureStrings you create yourself; any that don't exist are skipped.
          GITHUB_TOKEN_PARAM: /whydenied/github-token
          SLACK_WEBHOOK_PARAM: /whydenied/slack-webhook
          DISCORD_WEBHOOK_PARAM: /whydenied/discord-webhook
          OPENAI_KEY_PARAM: /whydenied/openai-api-key
          AI_PROVIDER: !Ref AIProvider
          OPENAI_MODEL: !Ref OpenAIModel
          BEDROCK_MODEL: !Ref BedrockModel
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DenialsTable
        # Read only the parameters under /whydenied/, nothing else in SSM.
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: /whydenied/*
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*

  AnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/whydenied-analyzer
      RetentionInDays: 7

  # Catches every denied API call CloudTrail records in this region.
  # ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS also delivers read-only calls
  # (List/Get/Describe), which plain ENABLED silently drops. See docs/PLAN.md.
  DenialRule:
    Type: AWS::Events::Rule
    Properties:
      Name: whydenied-denials
      State: ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS
      EventPattern:
        detail-type: ["AWS API Call via CloudTrail"]
        detail:
          errorCode:
            - prefix: AccessDenied
            - UnauthorizedOperation
            - Client.UnauthorizedOperation
      Targets:
        - Id: analyzer
          Arn: !GetAtt AnalyzerFunction.Arn

  DenialRuleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalyzerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DenialRule.Arn

Outputs:
  DenialsTableName:
    Value: !Ref DenialsTable
  AnalyzerFunctionName:
    Value: !Ref AnalyzerFunction
